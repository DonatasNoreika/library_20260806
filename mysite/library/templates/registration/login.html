{% extends 'base.html' %}

{% block title %}Prisijungimas{% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}

</form>

<p><a href="{% url 'password_reset' %}" class="btn btn-link w-100">Pamiršote slaptažodį?</a></p>

{% endblock %}
