{% extends 'base.html' %}

{% block title %}PRADŽIA{% endblock %}

{% block content %}
{% if user.profile.photo %}
<img src="{{ user.profile.photo.url }}" class="rounded-circle mb-4" width="50%">
{% endif %}
<h1>{{ user.username }} profilis</h1>
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Pakeisti</button>
</form>

{% endblock %}
